name: Desktop preview installers
on:
  workflow_dispatch:
  push:
    branches: [papertrace/settings-backend-4247508]
    paths:
      - '.github/workflows/desktop-preview.yml'
      - 'backend/engine/packages/session/session-log-deepseek/src/types.ts'
      - 'frontend/scripts/release-runtime.py'
      - 'frontend/src-tauri/tauri.release.conf.json'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            arch: arm64
          - os: windows-2022
            bundle: nsis
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: astral-sh/setup-uv@v6
      - name: Build agent from the vendored source
        working-directory: backend/engine
        run: |
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          pnpm install --frozen-lockfile
          pnpm run build:native-system
          node --import tsx/esm scripts/compile-referenced-projects.ts host-libraries
          stage="$(node -p "require('node:path').join(process.env.RUNNER_TEMP,'agent')")"
          hook="$(node -p "require('node:path').resolve('scripts/python-runtime-deploy.pnpmfile.mjs')")"
          pnpm --filter dsh-python-runtime-closure deploy --prod --config.allow-unused-patches=true --config.node-linker=hoisted "--config.pnpmfile=$hook" --config.link-workspace-packages=true --config.hoist-workspace-packages=false "$stage"
          node scripts/stage-papertrace.ts "$stage"
      - name: Pack standalone runtime
        run: |
          uv python install 3.12.13
          mkdir -p "$RUNNER_TEMP/runtime-build"
          curl -fsSL https://raw.githubusercontent.com/nodejs/node/v24.14.0/LICENSE -o "$RUNNER_TEMP/runtime-build/NODE-LICENSE"
          uv run --no-project --python 3.12.13 frontend/scripts/release-runtime.py "$RUNNER_TEMP/agent" "$RUNNER_TEMP/runtime-build"
      - name: Build installer
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tauri build --features bundled-runtime --bundles ${{ matrix.bundle }} --config src-tauri/tauri.release.conf.json
      - name: Install macOS preview into a temporary Applications directory
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/mount" "$RUNNER_TEMP/Applications"
          hdiutil attach frontend/src-tauri/target/release/bundle/dmg/*.dmg -mountpoint "$RUNNER_TEMP/mount" -nobrowse
          ditto "$RUNNER_TEMP/mount/PaperTrace.app" "$RUNNER_TEMP/Applications/PaperTrace.app"
          hdiutil detach "$RUNNER_TEMP/mount"
          echo "PACKAGE_RESOURCES=$RUNNER_TEMP/Applications/PaperTrace.app/Contents/Resources" >> "$GITHUB_ENV"
      - name: Install Windows preview for current user
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item frontend/src-tauri/target/release/bundle/nsis/*.exe
          $dest = Join-Path $env:RUNNER_TEMP 'PaperTrace'
          $proc = Start-Process $installer.FullName -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed ($($proc.ExitCode))" }
          "PACKAGE_RESOURCES=$dest" >> $env:GITHUB_ENV
      - name: Verify installed runtime, PDF import and paper Q&A
        run: uv run --no-project --python 3.12.13 frontend/scripts/smoke-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaperTrace-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/nsis/*.exe
