name: PaperTrace baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r tests/baseline/requirements.txt -r data-preparation/requirements.txt
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: npm ci --prefix tests/baseline
      - run: npm test --prefix tests/baseline
